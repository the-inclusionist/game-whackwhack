# SPDX-License-Identifier: AGPL-3.0-or-later
#
# ADR-0068 §4: a game's workflow INVOKES the organisation's reusable one and copies nothing. Three
# hundred copies of a pipeline drift, and the ones that drift silently are the ones that stop
# gating — while the repository still shows a green tick.
#
# The reusable workflow lives in the ENGINE repository rather than in a `.github` one, because
# ADR-0067 §5 says a repository is created when a RECORD declares its address, and no record
# declares one for a workflows repository.
#
# ========================= WHAT USED TO BLOCK THIS, AND NO LONGER DOES =========================
# This file shipped RED on purpose, twice over, and both reasons are now gone. Kept as a short
# history because a workflow that has never run green is worth explaining to whoever sees the first
# failure that is genuinely its own.
#
#   1. The engine was `file:../SP-the-inclusionist-tracer` — a sibling directory that existed on one
#      machine and nowhere else — so `npm ci` failed before any gate ran. It was published to public
#      npmjs on 2026-09-06 (ADR-0072's answer, because a volunteer without a token cannot install
#      from GitHub Packages). The dependency here is the pinned `9.0.0`.
#   2. Engine 6.36.1 shipped `dist-pkg/platform/tts.js` importing `@mintplex-labs/piper-tts-web`
#      from its own `devDependencies`, which npm does not install for a consumer, so the BUILD
#      failed. 7.0.1 removed the import. `tests/docs.node.test.ts` now checks the general case:
#      every bare specifier in the engine's shipped code must be something a consumer will have.
#
# ⚠️ THE PIN IS EXACT, AND STAYS EXACT NOW THAT IT IS NO LONGER A CANDIDATE. It was pinned to an
# RC for a while — 9.0.0 shipped on 2026-09-11 and is now `latest` — and the exactness was easy to
# defend then, because a caret on a prerelease is how a build changes under a runner with nothing in
# the diff to show it. It is worth defending for a stable release too, and for the plainer reason: a
# range means the runner and this machine can compile different code from the same commit.
#
# The local gates are still the ones with more in them: `npm run validate` plus
# `bash tests/mutation-check.sh`, which no runner has ever run — though a human has, in full, on
# 2026-09-11: 216 of 216 caught, nothing escaped, about nine minutes. The result is recorded at
# the top of that script.
#
# ========================= WHAT THE a11y INPUT MEANS HERE =========================
# ✅ THE ADDRESS IS READ NOW, and this paragraph used to say it was not. The reusable workflow
# serves the built game on a port and hands its address over as `AXE_URL`; `test:a11y` runs TWO
# audits against it, and they cover different things on purpose:
#
#   1. `tests/a11y.browser.test.ts` boots `boot/main` inside Vitest. It can drive the game into
#      BOTH of its states and it reads `app/index.html` with `?raw` rather than imitating it —
#      but it audits the MODULE GRAPH, not the bundle a child downloads.
#   2. `tests/axe-url.mjs` audits the BUILT page at `AXE_URL`, in both states as well, driving it
#      with `?debug=true` so the running mat is real rather than an empty grid wearing its name.
#
# ⚠️ AND A MISSING `AXE_URL` IS ANNOUNCED RATHER THAN SWALLOWED. Locally there is no server and
# the second audit is a no-op — which is right — but a no-op that looked like a pass is how this
# gap stayed open in the first place. The script prints which of the two happened, every run.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    uses: the-inclusionist/the-inclusionist-engine/.github/workflows/game-ci.yml@main
    with:
      # ⚠️ Named rather than left to its default. The input exists so that skipping pillar 2 is a
      # VISIBLE line in the caller instead of an absence — and this game answers `tick: 'clock'`,
      # which is the field that puts WCAG 2.2.1 in play. It is the last one that should skip it.
      a11y: true
